name: api
on:
  push:
    paths: ["apps/api/**", "db/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", "db/**", ".github/workflows/api.yml"]
permissions:
  contents: read
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Start PostgreSQL and apply migrations
        working-directory: .
        run: |
          cp .env.example .env
          docker compose -f deploy/compose/docker-compose.yml --env-file .env up -d --build --wait postgres s3
          set -a; . ./.env; set +a
          docker run --rm --network host -v "$PWD/db:/db:ro" ghcr.io/amacneil/dbmate:2 \
            --url "$MIGRATOR_DATABASE_URL" --migrations-dir /db/migrations --no-dump-schema up
      - run: uv run pytest -q
