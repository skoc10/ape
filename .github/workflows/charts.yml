name: charts
on:
  push:
    paths: ["deploy/helm/**", "agent/**", ".github/workflows/charts.yml"]
  pull_request:
    paths: ["deploy/helm/**", "agent/**", ".github/workflows/charts.yml"]
permissions:
  contents: read
concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint every chart that has a Chart.yaml
        run: |
          shopt -s nullglob
          for chart in deploy/helm/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm lint "$chart" -f "$chart/ci/test-values.yaml"
            else
              echo "skip $chart (no Chart.yaml yet)"
            fi
          done
      - name: ape-agent refuses unsafe values
        run: |
          chart=deploy/helm/ape-agent
          ! helm template t $chart --set endpoint=wss://cp.example.invalid/v1/agent
          ! helm template t $chart -f $chart/ci/test-values.yaml --set endpoint=ws://cp.example.invalid/v1/agent
          ! helm template t $chart -f $chart/ci/test-values.yaml --set endpoint=http://cp.example.invalid
      - name: ServiceMonitor is rendered only when metrics are enabled
        run: |
          chart=deploy/helm/ape-agent
          ! helm template t $chart -f $chart/ci/test-values.yaml | grep -q "kind: ServiceMonitor"
          helm template t $chart -f $chart/ci/test-values.yaml --set metrics.enabled=true | grep -q "kind: ServiceMonitor"
          helm template t $chart -f $chart/ci/test-values.yaml | grep -q '"127.0.0.1:9090"'

  # Installs the agent chart on kind and proves the ServiceAccount is read-only.
  agent-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: ape-ci
      - name: Build and load the agent image
        run: |
          docker build -t ghcr.io/skoc10/ape-agent:ci agent
          kind load docker-image ghcr.io/skoc10/ape-agent:ci --name ape-ci
      - name: helm install
        run: |
          helm install ape-agent deploy/helm/ape-agent -n ape-system --create-namespace \
            -f deploy/helm/ape-agent/ci/test-values.yaml --set image.tag=ci --wait --timeout 120s
          kubectl -n ape-system get pods
      - name: Pod is non-root with a read-only root filesystem
        run: |
          ctx=$(kubectl -n ape-system get pod -l app.kubernetes.io/name=ape-agent \
            -o jsonpath='{.items[0].spec.containers[0].securityContext}')
          echo "$ctx"
          echo "$ctx" | grep -q '"readOnlyRootFilesystem":true'
          echo "$ctx" | grep -q '"allowPrivilegeEscalation":false'
          kubectl -n ape-system get pod -l app.kubernetes.io/name=ape-agent \
            -o jsonpath='{.items[0].spec.securityContext.runAsNonRoot}' | grep -q true
      - name: ServiceAccount has no write access and no access to secrets
        run: deploy/helm/ape-agent/ci/rbac-check.sh ape-system
      - name: Agent log
        if: always()
        run: kubectl -n ape-system logs deploy/ape-agent --tail=20 || true
