# Publishes the Control Plane images (web, api, worker, migrate) and Helm chart to ghcr.io.
# Trigger: push a tag like cp-v0.1.0, or run manually.
name: control-plane-release
on:
  push:
    tags: ["cp-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, e.g. 0.1.0
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#cp-v}}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: api
          push: true
          tags: ghcr.io/${{ steps.v.outputs.owner }}/ape-api:${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: worker
          push: true
          tags: ghcr.io/${{ steps.v.outputs.owner }}/ape-worker:${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ghcr.io/${{ steps.v.outputs.owner }}/ape-web:${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: db
          file: db/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.v.outputs.owner }}/ape-migrate:${{ steps.v.outputs.version }}
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ steps.v.outputs.owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/ape-control-plane --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/ape-control-plane-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"
