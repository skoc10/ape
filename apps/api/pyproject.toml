[project]
name = "ape"
version = "0.1.0"
description = "Autonomous Platform Engineering control plane (api + worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "structlog>=24",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "boto3>=1.35",
    "pydantic-ai-slim[anthropic,openai]>=2.74.0",
    "pyyaml>=6",
    "jinja2>=3.1",
    "weasyprint>=62",
    "ruamel-yaml>=0.18",
]

[project.scripts]
ape-worker = "ape.worker:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-pyyaml>=6.0.12.20261122",
    "pypdf>=7.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ape"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "ASYNC210"]
# Repositories interpolate only module-level column lists; every value is a bound parameter.
"ape/repos/**" = ["S608"]
# Generated code: descriptions come verbatim from the JSON Schema.
"ape/gateway/protocol_gen.py" = ["E501", "UP"]
# SVG markup reads better on one line per element.
"ape/reports/charts.py" = ["E501"]
# Long REST call signatures and Markdown sentences.
"ape/github/app.py" = ["E501"]
"ape/github/pull_request.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ape"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
