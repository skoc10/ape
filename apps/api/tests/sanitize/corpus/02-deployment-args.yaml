apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: prod}
spec:
  template:
    spec:
      containers:
        - name: worker
          image: ghcr.io/acme/worker:2.0.0
          args:
            - "--redis-password=${REDIS_PASSWORD}"
            - "--dsn=postgres://app:${DB_PASSWORD}@db.prod.svc:5432/app"
            - "--workers=4"
