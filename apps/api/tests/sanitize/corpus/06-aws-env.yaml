apiVersion: batch/v1
kind: Job
metadata: {name: backup, namespace: ops}
spec:
  template:
    spec:
      containers:
        - name: backup
          image: amazon/aws-cli:2.17.0
          env:
            - {name: AWS_ACCESS_KEY_ID, value: "${AWS_KEY}"}
            - {name: AWS_SECRET_ACCESS_KEY, value: "${AWS_SECRET}"}
            - {name: AWS_REGION, value: eu-central-1}
