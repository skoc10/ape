apiVersion: v1
kind: Pod
metadata: {name: header, namespace: prod}
spec:
  containers:
    - name: app
      image: acme/app:1.0.0
      readinessProbe:
        httpGet:
          path: /ready
          port: 8080
          httpHeaders:
            - {name: Authorization, value: "Basic ${BASIC_AUTH}"}
