apiVersion: batch/v1
kind: CronJob
metadata: {name: sync, namespace: ops}
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sync
              image: acme/sync:0.9.0
              command: ["sh", "-c", "export TOKEN=${API_TOKEN}; export API_KEY='${RANDOM_TOKEN}'; exec sync"]
