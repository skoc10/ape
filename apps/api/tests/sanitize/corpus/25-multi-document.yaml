apiVersion: v1
kind: Service
metadata:
  name: hook
  namespace: prod
  annotations:
    example.com/api-token: "${API_TOKEN}"
---
apiVersion: v1
kind: Pod
metadata: {name: hook, namespace: prod}
spec:
  containers:
    - name: hook
      image: acme/hook:2.2.0
      env: [{name: HOOK_SECRET, value: "${WEBHOOK_SECRET}"}]
