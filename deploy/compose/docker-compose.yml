# Local development stack. Run through `task dev` / `task infra:up` from the repo root.
# Values come from the root .env file (see .env.example); defaults below are dev-only.
name: ape

services:
  postgres:
    build: ./postgres
    image: ape-postgres:16-pgtap
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ape}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. The application only speaks the S3 API, so any
  # S3 service can replace this by changing S3_ENDPOINT_URL and the access keys.
  s3:
    image: chrislusf/seaweedfs:4.55
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ape-dev-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ape-dev-secret-key}
      S3_BUCKETS: ${S3_BUCKET_SNAPSHOTS:-snapshots},${S3_BUCKET_REPORTS:-reports}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        umask 077
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"ape","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed mini -dir=/data -ip=s3 -ip.bind=0.0.0.0 -bucket="$$S3_BUCKETS" \
          -s3.config=/tmp/s3.json -webdav=false -master.telemetry=false \
          -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  s3data:
