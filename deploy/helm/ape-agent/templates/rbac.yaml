apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ape-agent-readonly
  labels:
    {{- include "ape-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, namespaces, nodes, serviceaccounts, resourcequotas, limitranges]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
# secrets and configmaps are deliberately absent. Secrets are only inferred from
# references in pod specs (secretKeyRef, volume names), never read.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ape-agent-readonly
  labels:
    {{- include "ape-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ape-agent-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "ape-agent.name" . }}
    namespace: {{ .Release.Namespace }}
