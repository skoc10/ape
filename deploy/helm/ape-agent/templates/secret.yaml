{{- include "ape-agent.validate" . -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ape-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ape-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.token | quote }}
{{- end }}
