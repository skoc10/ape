{{- if eq .Values.postgres.mode "cnpg" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  # Superuser access is used only by the migration job, to create the three roles.
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: app_migrator
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- if .Values.postgres.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
    barmanObjectStore:
      {{- if .Values.postgres.backup.external.enabled }}
      # Outside this cluster: survives the loss of the node.
      destinationPath: {{ required "postgres.backup.external.destinationPath is required, e.g. s3://bucket/prefix" .Values.postgres.backup.external.destinationPath | quote }}
      {{- with .Values.postgres.backup.external.endpointUrl }}
      endpointURL: {{ . | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ required "postgres.backup.external.existingSecret is required" .Values.postgres.backup.external.existingSecret }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Values.postgres.backup.external.existingSecret }}
          key: SECRET_ACCESS_KEY
      {{- else }}
      destinationPath: s3://{{ .Values.postgres.backup.bucket }}/
      endpointURL: {{ include "cp.s3Endpoint" . }}
      # An identity of its own that can only use the backup bucket. Backups hold every
      # tenant and the auth tables without row level security, so the keys the api and
      # the worker run with must not be able to read them.
      s3Credentials:
        accessKeyId:
          name: {{ include "cp.secretName" . }}
          key: S3_BACKUP_ACCESS_KEY
        secretAccessKey:
          name: {{ include "cp.secretName" . }}
          key: S3_BACKUP_SECRET_KEY
      {{- end }}
      wal:
        compression: gzip
  {{- end }}
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-pg-daily
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ .Release.Name }}-pg
{{- end }}
{{- end }}
