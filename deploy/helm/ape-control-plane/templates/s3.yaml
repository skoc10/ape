{{- if eq .Values.s3.mode "seaweedfs" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cp.selector" (dict "root" . "component" "s3") | nindent 4 }}
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-s3
  replicas: 1
  selector:
    matchLabels:
      {{- include "cp.selector" (dict "root" . "component" "s3") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cp.labels" . | nindent 8 }}
        {{- include "cp.selector" (dict "root" . "component" "s3") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ .Values.s3.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              umask 077
              # Two identities, each limited to its own buckets. Neither is an admin:
              # the buckets are created by the server itself (-bucket below).
              cat > /tmp/s3.json <<JSON
              {"identities":[
                {"name":"app","credentials":[{"accessKey":"$S3_ACCESS_KEY","secretKey":"$S3_SECRET_KEY"}],
                 "actions":[{{- range $i, $bucket := list .Values.s3.buckets.snapshots .Values.s3.buckets.reports }}{{ if $i }},{{ end }}"Read:{{ $bucket }}","Write:{{ $bucket }}","List:{{ $bucket }}","Tagging:{{ $bucket }}"{{- end }}]}
                {{- if include "cp.localBackup" . }},
                {"name":"backup","credentials":[{"accessKey":"$S3_BACKUP_ACCESS_KEY","secretKey":"$S3_BACKUP_SECRET_KEY"}],
                 "actions":["Read:{{ .Values.postgres.backup.bucket }}","Write:{{ .Values.postgres.backup.bucket }}","List:{{ .Values.postgres.backup.bucket }}","Tagging:{{ .Values.postgres.backup.bucket }}"]}
                {{- end }}
              ]}
              JSON
              exec weed mini -dir=/data -ip=$POD_IP -ip.bind=0.0.0.0 -bucket="$S3_BUCKETS" \
                -s3.config=/tmp/s3.json -webdav=false -master.telemetry=false \
                -s3.port.iceberg=0 -s3.port.lance=0
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: S3_BUCKETS
              value: "{{ .Values.s3.buckets.snapshots }},{{ .Values.s3.buckets.reports }}{{ if include "cp.localBackup" . }},{{ .Values.postgres.backup.bucket }}{{ end }}"
            {{- include "cp.secretEnv" (dict "root" . "name" "S3_ACCESS_KEY") | nindent 12 }}
            {{- include "cp.secretEnv" (dict "root" . "name" "S3_SECRET_KEY") | nindent 12 }}
            {{- if include "cp.localBackup" . }}
            {{- include "cp.secretEnv" (dict "root" . "name" "S3_BACKUP_ACCESS_KEY") | nindent 12 }}
            {{- include "cp.secretEnv" (dict "root" . "name" "S3_BACKUP_SECRET_KEY") | nindent 12 }}
            {{- end }}
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            httpGet: {path: /healthz, port: s3}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: s3}
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.s3.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.s3.storage.size }}
---
# SeaweedFS also listens on its master, volume and filer ports, and those take no
# credentials: the filer serves and deletes every bucket, the backups included, to anyone
# who can reach it. Only the S3 port, which checks the identities above, is let in.
# Needs a network plugin that enforces NetworkPolicy; k3s does out of the box.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cp.selector" (dict "root" . "component" "s3") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8333
{{- end }}
