{{- if not .Values.secrets.existingSecret }}
{{- /* Generated once; later upgrades read the existing values back. */ -}}
{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $gen := dict
    "APP_MIGRATOR_PASSWORD" (randAlphaNum 40)
    "APP_AUTH_PASSWORD" (randAlphaNum 40)
    "APP_BACKEND_PASSWORD" (randAlphaNum 40)
    "BETTER_AUTH_SECRET" (.Values.secrets.betterAuthSecret | default (randAlphaNum 48))
    "MASKING_KEY" (.Values.secrets.maskingKey | default (randAlphaNum 48))
    "S3_ACCESS_KEY" (randAlphaNum 20)
    "S3_SECRET_KEY" (randAlphaNum 40) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    # Never deleted with the release: MASKING_KEY and the database passwords cannot be
    # regenerated without losing data consistency.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $gen }}
  {{ $key }}: {{ index $existing $key | default ($value | b64enc) }}
  {{- end }}
{{- end }}
