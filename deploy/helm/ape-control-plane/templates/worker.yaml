apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One instance at a time: never two side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cp.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cp.labels" . | nindent 8 }}
        {{- include "cp.selector" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "cp.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "cp.image" (dict "root" . "name" "ape-worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "cp.containerSecurity" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9091
          env:
            {{- include "cp.backendEnv" . | nindent 12 }}
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            {{- with .Values.llm.apiKeySecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ . }}, key: LLM_API_KEY}
            {{- end }}
          livenessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    {{- include "cp.selector" (dict "root" . "component" "worker") | nindent 4 }}
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
