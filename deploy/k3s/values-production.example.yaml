# Copy to values-production.yaml (do not commit it) and adjust.
host: cp.example.com

image:
  tag: "0.1.0"

s3:
  # A second DNS name for report downloads through presigned URLs.
  publicHost: files.example.com

postgres:
  storage:
    size: 20Gi
  backup:
    enabled: true          # daily base backup + WAL archive into the S3 storage

observability:
  serviceMonitor:
    enabled: false         # true once the Prometheus Operator is installed

