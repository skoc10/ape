# NET-002: services reachable from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: storefront-public
  namespace: vuln-shop
spec:
  type: LoadBalancer
  selector: {app: storefront}
  ports:
    - {port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db-nodeport
  namespace: vuln-shop
spec:
  type: NodePort
  selector: {app: orders-db}
  ports:
    - {port: 5432, targetPort: 5432, nodePort: 30432}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: vuln-shop
spec:
  clusterIP: None
  selector: {app: orders-db}
  ports:
    - {port: 5432}
