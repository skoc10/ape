# Negative control: a workload that follows every rule. No finding may point here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: clean-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: clean-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: registry.k8s.io/pause:3.10
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: api-secrets, key: database-url}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          livenessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 3600}
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 3600}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: clean-app
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: clean-app
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: clean-app
spec:
  type: ClusterIP
  selector: {app: api}
  ports:
    - {port: 80, targetPort: 8080}
